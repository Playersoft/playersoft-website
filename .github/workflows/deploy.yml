name: Deploy to GitHub Pages

# Builds content/*.json into static HTML and publishes site/ to Pages.
#
# ONE-TIME SETUP (in the repo, before this runs):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# If you'd rather not use Actions at all, you can skip this file entirely and
# serve the pre-built site/ folder directly — see README.md, Option B.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages_status.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the build is plain Node.
      - name: Build site
        run: node build/build.mjs

      # Stops GitHub from running Jekyll, which would ignore _-prefixed files.
      - name: Add .nojekyll
        run: touch site/.nojekyll

      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - id: pages_status
        name: Check Pages configuration
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages is not enabled for this repository. Set Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow to publish the site."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_status.outputs.ready == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
