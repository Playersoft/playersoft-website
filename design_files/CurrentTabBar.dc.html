<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:83px;background:#fff;border-top:1px solid #d1d1d6;display:flex;align-items:flex-start;padding-top:5px;position:relative">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
<img src="assets/icon-group-light.png" style="width:25px;height:25px;object-fit:contain;filter:{{ groupsFilter }}">
<span style="font-size:10px;color:{{ groupsColor }}">Groups</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
<img src="assets/tab-events-light.png" style="width:25px;height:25px;object-fit:contain;filter:{{ eventsFilter }}">
<span style="font-size:10px;color:{{ eventsColor }}">Events</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center">
<div style="width:36px;height:36px;background:#007AFF;border-radius:10px;display:flex;align-items:center;justify-content:center">
<img src="assets/tab-identify.png" style="width:22px;height:22px;object-fit:contain;filter:brightness(0) invert(1)">
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
<img src="assets/tab-floor-light.png" style="width:25px;height:25px;object-fit:contain;filter:{{ floorFilter }}">
<span style="font-size:10px;color:{{ floorColor }}">Floor</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
<img src="assets/tab-more.png" style="width:25px;height:25px;object-fit:contain;filter:{{ moreFilter }}">
<span style="font-size:10px;color:{{ moreColor }}">More</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:83},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;groups&quot;,&quot;events&quot;,&quot;identify&quot;,&quot;floor&quot;,&quot;more&quot;],&quot;default&quot;:&quot;identify&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "identify";
    const on = "invert(38%) sepia(93%) saturate(3676%) hue-rotate(199deg) brightness(101%) contrast(105%)";
    const off = "grayscale(1) opacity(.55)";
    const vals = {};
    for (const t of ["groups","events","floor","more"]) {
      vals[t+"Filter"] = active===t ? on : off;
      vals[t+"Color"] = active===t ? "#007AFF" : "#8e8e93";
    }
    return vals;
  }
}
</script>
</body>
</html>
