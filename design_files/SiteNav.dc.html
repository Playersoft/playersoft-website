<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/tokens/fonts.css">
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/tokens/colors.css">
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/tokens/typography.css">
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/tokens/spacing.css">
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/tokens/effects.css">
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/tokens/base.css">
<link rel="stylesheet" href="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/styles.css">
<script src="_ds/playersoft-design-system-7bdeae32-bbd5-4dce-afd3-f737bbc3977c/_ds_bundle.js"></script>
</helmet>
<div style="background: var(--surface-page); border-bottom: 1px solid var(--border-subtle)">
  <div style="height: 3px; background: var(--gradient-aqua)"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; padding: 16px 40px; max-width: 1440px; margin: 0 auto; box-sizing: border-box">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0">
      <span data-ps-logo="true" style="{{ logoWrap }}"><img src="{{ logoSrc }}" alt="Playersoft" style="height: 40px; display: block"></span>
    </a>
    <nav style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
      <a href="Home.dc.html" style="font: 600 13px var(--font-body); letter-spacing: 0.14em; text-decoration: none; padding: 6px 0; color: {{cHome}}; border-bottom: {{bHome}}" style-hover="color: var(--text-strong)">HOME</a>
      <a href="About.dc.html" style="font: 600 13px var(--font-body); letter-spacing: 0.14em; text-decoration: none; padding: 6px 0; color: {{cAbout}}; border-bottom: {{bAbout}}" style-hover="color: var(--text-strong)">ABOUT</a>
      <a href="Solutions.dc.html" style="font: 600 13px var(--font-body); letter-spacing: 0.14em; text-decoration: none; padding: 6px 0; color: {{cSolutions}}; border-bottom: {{bSolutions}}" style-hover="color: var(--text-strong)">SOLUTIONS</a>
      <a href="Contact.dc.html" style="font: 600 13px var(--font-body); letter-spacing: 0.14em; text-decoration: none; padding: 6px 0; color: {{cContact}}; border-bottom: {{bContact}}" style-hover="color: var(--text-strong)">CONTACT</a>
      <a href="Contact.dc.html" style="text-decoration: none; white-space: nowrap; flex-shrink: 0">
        <x-import component-from-global-scope="PlayersoftDesignSystem_7bdeae.Button" variant="primary" size="sm" hint-size="120px,36px">Book a Demo</x-import>
      </a>
    </nav>
  </div>
  <sc-if value="{{ showSub }}" hint-placeholder-val="{{ false }}">
    <div style="border-top: 1px solid var(--border-subtle); background: var(--surface-sunken)">
      <div style="display: flex; align-items: center; gap: 28px; padding: 10px 64px; max-width: 1440px; margin: 0 auto; box-sizing: border-box">
        <span style="font: 600 12px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted)">SOLUTIONS</span>
        <a href="OneMobileApp.dc.html" style="font: 600 12px var(--font-body); letter-spacing: 0.1em; text-decoration: none; color: {{cApp}}" style-hover="color: var(--text-strong)">ONE MOBILE APP</a>
        <a href="OneLoyalty.dc.html" style="font: 600 12px var(--font-body); letter-spacing: 0.1em; text-decoration: none; color: {{cLoy}}" style-hover="color: var(--text-strong)">ONE MESSAGING + LOYALTY</a>
        <a href="HPM.dc.html" style="font: 600 12px var(--font-body); letter-spacing: 0.1em; text-decoration: none; color: {{cHpm}}" style-hover="color: var(--text-strong)">HOST-PLAYER MANAGEMENT</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 120}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;about&quot;, &quot;solutions&quot;, &quot;one-app&quot;, &quot;one-loyalty&quot;, &quot;hpm&quot;, &quot;partners&quot;, &quot;news&quot;, &quot;contact&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const solFamily = ['solutions', 'one-app', 'one-loyalty', 'hpm'];
    const isSol = solFamily.includes(active);
    const link = (key, on) => {
      const a = key === 'solutions' ? isSol : active === key;
      return on === 'c' ? (a ? 'var(--text-strong)' : 'var(--text-body)') : (a ? '2px solid var(--color-primary)' : '2px solid transparent');
    };
    const sub = (key) => active === key ? 'var(--color-accent-hover)' : 'var(--text-body)';
    return {
      logoSrc: 'assets/logo-red-full.png',
      logoWrap: 'display: flex; align-items: center',
      cHome: link('home', 'c'), bHome: link('home', 'b'),
      cAbout: link('about', 'c'), bAbout: link('about', 'b'),
      cSolutions: link('solutions', 'c'), bSolutions: link('solutions', 'b'),
      cContact: link('contact', 'c'), bContact: link('contact', 'b'),
      showSub: isSol,
      cApp: sub('one-app'), cLoy: sub('one-loyalty'), cHpm: sub('hpm')
    };
  }
}
</script>
</body>
</html>
